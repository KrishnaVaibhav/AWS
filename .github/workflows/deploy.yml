name: 🚀 Deploy CloudFormation

on:
  push:
    branches: [main]
    paths:
      - 'stacks/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'stacks/**'
  workflow_dispatch:
    inputs:
      arm_nuke:
        description: '💣 Arm the nuke (true deletes resources on budget breach)'
        type: choice
        options: ['false', 'true']
        default: 'false'

permissions:
  id-token: write      # required for OIDC
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  STACK_NAME: budget-nuke

jobs:

  validate:
    name: 🔍 Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧾 Print run context
        run: |
          echo "::group::🧾 Run context"
          echo "🔖 Event         : ${{ github.event_name }}"
          echo "🌿 Ref           : ${{ github.ref }}"
          echo "🔢 SHA           : ${{ github.sha }}"
          echo "👤 Actor         : ${{ github.actor }}"
          echo "📦 Repository    : ${{ github.repository }}"
          echo "🌍 AWS Region    : ${{ env.AWS_REGION }}"
          echo "🏷️  Stack Name    : ${{ env.STACK_NAME }}"
          echo "💣 Arm Nuke      : ${{ github.event.inputs.arm_nuke || 'false' }}"
          echo "::endgroup::"
          echo "::group::📂 Repository tree"
          ls -la
          echo "--- stacks/ ---"
          ls -la stacks/ || true
          echo "::endgroup::"

      - name: 🪪 Decode OIDC claims
        run: |
          echo "::group::🪪 OIDC token claims"
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')
          P=$(echo "$TOKEN" | cut -d. -f2)
          while [ $((${#P} % 4)) -ne 0 ]; do P="${P}="; done
          echo "$P" | tr '_-' '/+' | base64 -d | jq '{sub, aud, iss, repository, ref}'
          echo "::endgroup::"

      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🧑‍💼 Show assumed identity
        run: |
          echo "::group::🧑‍💼 STS caller identity"
          aws sts get-caller-identity --output table
          echo "::endgroup::"

      - name: ✅ Validate template
        run: |
          echo "::group::✅ CloudFormation validate-template"
          aws cloudformation validate-template \
            --template-body file://stacks/budget-nuke.yaml \
            --output table
          echo "::endgroup::"

      - name: 🧹 Lint (cfn-lint)
        run: |
          echo "::group::🧹 cfn-lint"
          pip install cfn-lint
          cfn-lint --version
          cfn-lint stacks/*.yaml --format parseable || LINT_RC=$?
          echo "cfn-lint exit code: ${LINT_RC:-0}"
          echo "::endgroup::"
          exit ${LINT_RC:-0}

      - name: 📝 Job summary
        if: always()
        run: |
          {
            echo "## 🔍 Validate & Lint"
            echo ""
            echo "| Check | Status |"
            echo "|---|---|"
            echo "| ✅ Template validation | \`${{ job.status }}\` |"
            echo "| 🧹 cfn-lint | \`${{ job.status }}\` |"
            echo ""
            echo "🏷️ Stack: \`${{ env.STACK_NAME }}\` · 🌍 Region: \`${{ env.AWS_REGION }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  changeset:
    name: 📋 Change Set (PR preview)
    # Show what a PR would change, without applying it.
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 📋 Create change set (no execute)
        run: |
          echo "::group::📋 Creating change set"
          aws cloudformation deploy \
            --template-file stacks/budget-nuke.yaml \
            --stack-name ${{ env.STACK_NAME }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-execute-changeset \
            --parameter-overrides \
                BudgetAmount=${{ vars.BUDGET_AMOUNT }} \
                AlertEmail=${{ secrets.ALERT_EMAIL }} \
                ArmNuke=false \
            2>&1 | tee changeset.txt || true
          echo "::endgroup::"
          echo "::group::📄 Raw change set output"
          cat changeset.txt
          echo "::endgroup::"

      - name: 🔬 Describe change set details
        run: |
          echo "::group::🔬 Change set contents"
          CS_ARN=$(grep -oE 'arn:aws:cloudformation:[^ ]*changeSet/[^ ]*' changeset.txt | head -1 || true)
          if [ -n "$CS_ARN" ]; then
            echo "🔗 Change set: $CS_ARN"
            aws cloudformation describe-change-set --change-set-name "$CS_ARN" \
              --query 'Changes[].ResourceChange.{Action:Action,Type:ResourceType,LogicalId:LogicalResourceId,Replacement:Replacement}' \
              --output table
            aws cloudformation describe-change-set --change-set-name "$CS_ARN" --output json > changeset.json
            echo "--- full JSON ---"
            cat changeset.json
          else
            echo "ℹ️ No change set ARN found — likely no changes to apply."
          fi
          echo "::endgroup::"

      - name: 📝 Job summary
        if: always()
        run: |
          {
            echo "## 📋 Change Set Preview"
            echo ""
            echo "🏷️ Stack: \`${{ env.STACK_NAME }}\` · 🌍 Region: \`${{ env.AWS_REGION }}\`"
            echo ""
            echo "<details><summary>📄 Change set output</summary>"
            echo ""
            echo '```'
            cat changeset.txt 2>/dev/null || echo "no output"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload change set artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: changeset
          path: |
            changeset.txt
            changeset.json
          if-no-files-found: ignore

  deploy:
    name: 🚀 Deploy Stack
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    # Optional: set up a GitHub Environment with required reviewers
    # so arming the nuke needs an approval click.
    environment: aws
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔎 Pre-deploy stack state
        run: |
          echo "::group::🔎 Existing stack status"
          aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].{Status:StackStatus,Updated:LastUpdatedTime,Created:CreationTime}' \
            --output table 2>/dev/null || echo "ℹ️ Stack does not exist yet — this will be a CREATE."
          echo "::endgroup::"

      - name: 🚀 Deploy stack
        run: |
          echo "::group::🚀 aws cloudformation deploy"
          echo "💣 ArmNuke = ${{ github.event.inputs.arm_nuke || 'false' }}"
          aws cloudformation deploy \
            --template-file stacks/budget-nuke.yaml \
            --stack-name ${{ env.STACK_NAME }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
                BudgetAmount=${{ vars.BUDGET_AMOUNT }} \
                AlertEmail=${{ secrets.ALERT_EMAIL }} \
                ArmNuke=${{ github.event.inputs.arm_nuke || 'false' }}
          echo "::endgroup::"

      - name: 📊 Show stack outputs
        run: |
          echo "::group::📊 Stack outputs (table)"
          aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs' \
            --output table
          echo "::endgroup::"
          echo "::group::📊 Stack outputs (json)"
          aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs' \
            --output json | tee outputs.json
          echo "::endgroup::"

      - name: ⚙️ Show stack parameters
        run: |
          echo "::group::⚙️ Stack parameters"
          aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Parameters' \
            --output table
          echo "::endgroup::"

      - name: 🧱 Show stack resources
        run: |
          echo "::group::🧱 Stack resources"
          aws cloudformation describe-stack-resources \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'StackResources[].{LogicalId:LogicalResourceId,Type:ResourceType,Status:ResourceStatus,PhysicalId:PhysicalResourceId}' \
            --output table | tee resources.txt
          echo "::endgroup::"

      - name: 🕒 Show recent stack events
        if: always()
        run: |
          echo "::group::🕒 Last 25 stack events"
          aws cloudformation describe-stack-events \
            --stack-name ${{ env.STACK_NAME }} \
            --max-items 25 \
            --query 'StackEvents[].{Time:Timestamp,Logical:LogicalResourceId,Status:ResourceStatus,Reason:ResourceStatusReason}' \
            --output table | tee events.txt
          echo "::endgroup::"

      - name: 📝 Job summary
        if: always()
        run: |
          {
            echo "## 🚀 Deploy Stack"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| 🏷️ Stack | \`${{ env.STACK_NAME }}\` |"
            echo "| 🌍 Region | \`${{ env.AWS_REGION }}\` |"
            echo "| 💣 ArmNuke | \`${{ github.event.inputs.arm_nuke || 'false' }}\` |"
            echo "| 🔢 Commit | \`${{ github.sha }}\` |"
            echo "| 📌 Result | \`${{ job.status }}\` |"
            echo ""
            echo "### 📊 Stack Outputs"
            echo '```json'
            cat outputs.json 2>/dev/null || echo "[]"
            echo '```'
            echo ""
            echo "<details><summary>🧱 Resources</summary>"
            echo ""
            echo '```'
            cat resources.txt 2>/dev/null || echo "n/a"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>🕒 Recent events</summary>"
            echo ""
            echo '```'
            cat events.txt 2>/dev/null || echo "n/a"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload deploy artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-outputs
          path: |
            outputs.json
            resources.txt
            events.txt
          if-no-files-found: ignore

  summary:
    name: 🧾 Pipeline Summary
    if: always()
    needs: [validate, changeset, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Print pipeline summary
        run: |
          V="${{ needs.validate.result }}"
          C="${{ needs.changeset.result }}"
          D="${{ needs.deploy.result }}"
          icon() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "🚫" ;;
              skipped)   echo "⏭️" ;;
              *)         echo "❔" ;;
            esac
          }
          echo "::group::🧾 Pipeline summary"
          echo "════════════════════════════════════════════"
          echo "  🚀 Deploy CloudFormation — Pipeline Report"
          echo "════════════════════════════════════════════"
          echo "  📦 Repo      : ${{ github.repository }}"
          echo "  🌿 Ref       : ${{ github.ref_name }}"
          echo "  🔢 Commit    : ${{ github.sha }}"
          echo "  👤 Actor     : ${{ github.actor }}"
          echo "  🔖 Event     : ${{ github.event_name }}"
          echo "  🏷️  Stack     : ${{ env.STACK_NAME }}"
          echo "  🌍 Region    : ${{ env.AWS_REGION }}"
          echo "  💣 ArmNuke   : ${{ github.event.inputs.arm_nuke || 'false' }}"
          echo "--------------------------------------------"
          echo "  $(icon "$V") 🔍 Validate & Lint      : $V"
          echo "  $(icon "$C") 📋 Change Set (PR)      : $C"
          echo "  $(icon "$D") 🚀 Deploy Stack         : $D"
          echo "════════════════════════════════════════════"
          echo "::endgroup::"

          {
            echo "# 🧾 Pipeline Summary"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| 🔍 Validate & Lint | $(icon "$V") \`$V\` |"
            echo "| 📋 Change Set (PR) | $(icon "$C") \`$C\` |"
            echo "| 🚀 Deploy Stack | $(icon "$D") \`$D\` |"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| 📦 Repo | \`${{ github.repository }}\` |"
            echo "| 🌿 Ref | \`${{ github.ref_name }}\` |"
            echo "| 🔢 Commit | \`${{ github.sha }}\` |"
            echo "| 👤 Actor | \`${{ github.actor }}\` |"
            echo "| 🔖 Event | \`${{ github.event_name }}\` |"
            echo "| 🏷️ Stack | \`${{ env.STACK_NAME }}\` |"
            echo "| 🌍 Region | \`${{ env.AWS_REGION }}\` |"
            echo "| 💣 ArmNuke | \`${{ github.event.inputs.arm_nuke || 'false' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ❌ Fail if any stage failed
        if: contains(needs.*.result, 'failure')
        run: |
          echo "❌ One or more pipeline stages failed."
          exit 1
