<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auction</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font: 16px/1.5 system-ui, sans-serif; background: #0b1725; color: #e9f1fa; }
    main { max-width: 34rem; padding: 2rem; }
    code { color: #93a9c4; }
    .ok { color: #8fd16a; }
    .bad { color: #ff8a6b; }
  </style>
</head>
<body>
  <main>
    <h1>Auction</h1>
    <p>Placeholder shell. The React PWA replaces this folder in phase 1.</p>
    <p>API: <span id="api">checking…</span></p>
    <p>Stage: <code id="stage">…</code></p>
  </main>
  <script type="module">
    const api = document.getElementById('api');
    try {
      const [config, health] = await Promise.all([
        fetch('/config.json').then((r) => r.json()),
        fetch('/api/health').then((r) => r.json()),
      ]);
      document.getElementById('stage').textContent = config.stage;
      api.textContent = health.ok ? 'healthy' : 'unhealthy';
      api.className = health.ok ? 'ok' : 'bad';
    } catch (err) {
      api.textContent = `unreachable (${err.message})`;
      api.className = 'bad';
    }
  </script>
</body>
</html>
