AWSTemplateFormatVersion: '2010-09-09'
Description: >
  One-time bootstrap. Creates the GitHub OIDC provider and a deploy role
  that GitHub Actions assumes. Deploy this manually once; everything else
  comes from the repo afterwards.

Parameters:
  SubjectClaimPrefix:
    Type: String
    Description: >
      The repo portion of the OIDC subject claim, without the trailing
      :ref:... segment. Get it from:
        gh api repos/OWNER/REPO/actions/oidc/customization/sub
      Immutable format (repos created or renamed after 2026-07-15):
        repo:owner@123456/repo@789012
      Legacy format:
        repo:owner/repo

Resources:

  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  # Jobs WITHOUT `environment:` get the ref form.
                  - !Sub '${SubjectClaimPrefix}:ref:refs/heads/main'
                  - !Sub '${SubjectClaimPrefix}:ref:refs/heads/dev'
                  - !Sub '${SubjectClaimPrefix}:ref:refs/heads/feature/*'
                  # Jobs WITH `environment: aws` get the environment form
                  # INSTEAD of the ref form. Without this line the deploy
                  # job cannot assume the role.
                  - !Sub '${SubjectClaimPrefix}:environment:aws'
      # Admin because the nuke stack creates IAM roles.
      # Narrow this if you later deploy stacks that don't touch IAM.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

Outputs:
  DeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
    Description: Set as the AWS_DEPLOY_ROLE_ARN secret / role-to-assume.
  OIDCProviderArn:
    Value: !Ref GitHubOIDCProvider
    Description: Reference only. Not used by the workflow.