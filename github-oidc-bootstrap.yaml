AWSTemplateFormatVersion: '2010-09-09'
Description: >
  One-time bootstrap. Creates the GitHub OIDC provider and a deploy role
  that GitHub Actions assumes. Deploy this manually once; everything else
  comes from the repo afterwards.

Parameters:
  GitHubOrg:
    Type: String
    Description: Your GitHub username or org name.

  GitHubRepo:
    Type: String
    Description: Repository name only, no owner prefix.

  AllowedBranch:
    Type: String
    Default: main
    Description: Only this branch may assume the role.

Resources:

  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Scoped to one repo AND one branch.
                # Widen to repo:ORG/REPO:* only if you know why.
                token.actions.githubusercontent.com:sub:
                  !Sub 'repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${AllowedBranch}'
      # Admin because the nuke stack creates IAM roles.
      # Narrow this if you later deploy stacks that don't touch IAM.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

Outputs:
  DeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
    Description: Put this in the workflow as role-to-assume.
  OIDCProviderArn:
    Value: !Ref GitHubOIDCProvider
    Description: Put this in the workflow as oidc-provider.